project:
  type: website
  output-dir: _site
  resources:
    - assets/

website:
  title: "aaron cochran"
  description: "Data infrastructure, governance and research tooling in state government — plus the occasional tabletop game."
  site-url: "https://hypnotoadie.github.io"
  repo-url: "https://github.com/hypnotoadie/hypnotoadie.github.io"
  favicon: assets/favicon.svg
  open-graph: true
  search: true
  navbar:
    logo: assets/favicon.svg
    logo-alt: "AC monogram"
    left:
      - text: Writing
        href: blog.qmd
      - text: About
        href: about.qmd
      - text: Contact
        href: contact.qmd
    right:
      - icon: github
        href: https://github.com/hypnotoadie
        aria-label: "GitHub profile"
      - icon: linkedin
        href: https://www.linkedin.com/in/aaroncochran/
        aria-label: "LinkedIn profile"
      - icon: rss
        href: blog.xml
        aria-label: "RSS feed"
  page-footer:
    left: "© 2026 Aaron Cochran · Views are my own, not my employer's."
    right: "Built with [Quarto](https://quarto.org) · hosted on GitHub Pages"

format:
  html:
    # The first theme listed is the default: dark first, light via the navbar toggle.
    theme:
      dark: [styles/dark.scss, styles/site.scss]
      light: [styles/light.scss, styles/site.scss]
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    include-after-body: assets/contact.html
